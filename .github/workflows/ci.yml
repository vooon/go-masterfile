name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go mod tidy -diff
      - name: test (race, coverage)
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: coverage gate (90%)
        run: |
          if [ ! -s coverage.out ]; then echo "no coverage profile (no packages yet)"; exit 0; fi
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 90.0) ? 0 : 1 }' \
            || { echo "coverage ${total}% is below 90%"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: FuzzParse for 60s
        run: |
          if ! grep -rqs 'func FuzzParse' --include='*_test.go' .; then
            echo "FuzzParse not implemented yet"; exit 0
          fi
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=60s .

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
