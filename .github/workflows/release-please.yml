name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN-created PRs do not trigger CI; set RELEASE_PLEASE_TOKEN
          # (a fine-grained PAT with contents+pull-requests write) to get checks
          # on the release PR. Falls back to GITHUB_TOKEN until then.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
